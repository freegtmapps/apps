# Revive closed-lost deals — composed from 2 skill(s) somebody else wrote.
#
# ORDER IS COMPOSITION ORDER, and it decides the credit line: `built_on` is
# derived from skill frontmatter in first-appearance order and can never be
# typed. Nothing about the credit on this page is a claim we made.
name: Revive closed-lost deals
description: "A quarterly sweep over closed-lost, gone-quiet proposals and champion job changes \u2014 with the right re-open message\u2026"
category: reach-out
version: 1.0.0
license: MIT
handler: llm

maintained_by:
  name: freegtm
  url: https://github.com/freegtmapps

say:
  - "what closed-lost deals should I revive?"
  - "run the revival sweep"

skills:
  - closed-lost-revival
  - stage-aware-follow-up

may:
  - read
  - write_lead
  - stage
  - emit

# Declared at the TOP LEVEL because Requires.Tools is derived from it rather
# than hand-written — hand entry plus a load-time check would be two sources
# that agree until somebody edits one.
tools: [crm]

# `may` gains `emit`, so this declaration becomes one the app can keep.
# `may` is enforced by projection alone (APP-BUNDLE §3, conformance rule 14):
# without `emit`, `emit_signal` is never projected and this named a signal the
# app structurally could not raise.
#
# BOTH FIXES IN ONE APP, which is why it is worth reading rather than copying.
#
# `revival.candidates` is kept and `emit` granted: identifying which closed-lost
# deals are worth reopening is a batch completion, and that the sweep finished is
# not derivable from the rows it wrote.
#
# `draft.staged` is DELETED, not granted. stage_draft emits it from inside the
# tool via `engine.emitPlatform`, with no allowlist check — see give-first-email
# for the precedent write-outreach set when it found this in a live run.
emits:
  - revival.candidates

# WORKSPACE SCOPE IS A CLOSED SET — company_name, crm, icp, industry, product,
# regions, sender_name, sender_voice. A manifest inventing a ninth is refused,
# because a workspace-scoped key nothing reads from the profile would be asked
# for and then silently dropped after the person answered. Everything else is
# app-scoped, which is the honest state rather than a workaround.
context:
  - key: sender_voice
    scope: workspace
    ask: "How does the person these go out from write? A sentence describing their style."
    type: text

# NO {{placeholders}}. A workspace value named by a placeholder and left unset
# REFUSES composition, so a placeholder is a promise that the app cannot run
# until somebody has spoken. These apps do not need that: every declared
# workspace value reaches the prompt through the Context section for every app,
# whether or not its prose names the key.
instructions: |-
  A quarterly sweep over closed-lost, gone-quiet proposals and champion job changes — with the right re-open message for each.

  Work from what you can actually reach and what is on the lead. Name what you could not find rather than filling it in — a gap stated is worth more than a gap invented, because the invented one gets repeated out loud.

  Write what you learn to the lead with update_lead.

  Stage anything for a person with stage_draft. Nothing is sent until they decide.
