# The demo app (DEMO-APP.md), and the first bundle whose credits are entirely
# other people's: Rutger Katz, Erwann Lefevre and Tanyo Gochev, none of them us.
#
# Its job IS context — it asks, remembers, writes workspace values other apps
# then read. So it exercises the memory layer rather than describing it.
name: Define your ICP
description: Who you sell to, built from won deals and real conversations — refined, not declared.
category: qualify
type: icp
version: 1.0.0
license: MIT
handler: llm

maintained_by:
  name: freegtm
  url: https://freegtm.ai/freegtm

say:
  - "help me define our ICP"
  - "who are we actually winning with?"
  - "set up who we sell to"

# Order is composition order: the method first, then how to find evidence for it,
# then how to lay the result out.
skills:
  - icp-builder
  - won-deal-icp-finder
  - icp-matrix-builder

# The completion gate, as a file that travels with the app.
#
# This was absent, and the comment here said why: nothing read a rules/
# directory and nothing called RegisterRule, so `evalPreRules` failed closed and
# an app declaring a rule did not run at all. That is now built — rules are
# FILES, resolved from the bundle — so the gate exists where the app is rather
# than where the binary was compiled, and DEMO-APP §4 step 6 is met.
rules: [icp-evidence.yaml]

# `learning:` IS ALSO ABSENT for a harder reason: it is not a field on
# domain.App, so a strict manifest decode refuses the whole file. Steps 9 and 15
# are recorded unmet rather than approximated.

# `requires.optional.tools` IS TYPED HERE, AND THAT IS NOT THE CONTRADICTION IT
# LOOKS LIKE. Two readers have now concluded that this file types a field the
# codebase says is derived, so the distinction is written down rather than left
# to whoever reads `bundle.go` next.
#
# They are two different fields that happen to sit one nesting level apart:
#
#   requires.tools           DERIVED, and a manifest literally cannot say it —
#                            `Tools []string \`yaml:"-"\`` (domain/bundle.go).
#                            `WithDerivedRequires` mirrors it from top-level
#                            `tools:`. Hand entry plus a load-time check is two
#                            sources that agree until somebody edits one.
#
#   requires.optional.tools  HAND-WRITTEN BY DESIGN — `yaml:"tools,omitempty"`
#                            on `OptionalRequires`, with the reason in the
#                            struct: it says what the app degrades gracefully
#                            without, "which is a judgement the maintainer makes
#                            rather than a fact about the file". Nothing can
#                            derive a judgement.
#
# So there is nothing to pick. What made it read as a contradiction is that
# `tools:` appears under `requires:` on the page, and the eye supplies the
# shorter path. This app declares only the optional one: it uses a CRM when a
# workspace has one — `best_customers` says infer_from: [crm] — and works by
# hand when it does not.
requires:
  optional:
    tools: [crm]

may:
  - read
  - write_lead
  - emit
  # Required before `scripts:` is accepted. It is a permission to hand a
  # caller code to run in THEIR environment, never a permission for this
  # server to run anything — the registry holds no runtime and runs nothing.
  - run

# The script upstream ships beside this skill, vendored rather than described.
#
# `won-deal-icp-finder`'s prose says "run scripts/analyze.py". For weeks it said
# that into a bundle with no such file: vendoring copied the SKILL.md and left
# the code behind, so the app instructed a model to run something that did not
# exist. The fix could not be to edit the prose — that would make
# `adapted: false` a lie and show as `adapted` on Erwann Lefevre's work — so the
# only honest repair was to carry the file.
#
# TWO PATHS THAT DIFFER AND ARE BOTH RIGHT. `file:` is relative to the app, so
# it names skills/…/scripts/analyze.py; the skill's own prose says
# scripts/analyze.py, which is upstream's skill-relative words. The match is on
# basename, which is exactly what lets them differ without either being wrong.
#
# `sha256` is deliberately absent: the loader fills it from the bytes on disk,
# so a manifest cannot claim a checksum it did not earn. Same rule as
# `requires.tools` being derived rather than typed.
scripts:
  - name: analyze_deals
    file: skills/won-deal-icp-finder/scripts/analyze.py
    skill: won-deal-icp-finder
    runtime: python3
    description: >-
      Deterministic deal analysis — ranks deals by value, aggregates revenue per
      company, measures concentration, and breaks it down by firmographics. It
      refuses to emit a best-effort result on bad input rather than returning a
      wrong revenue number.
    args:
      - name: input
        type: path
        description: the deal export to analyse
    # `needs: [crm]` WAS HERE AND IS DELIBERATELY GONE.
    #
    # It declared a capability the script does not use. `analyze.py` imports
    # `sys, csv, json, argparse, io, re` and `datetime` and nothing else — no
    # http client, no socket, no environment read, no credential of any kind. It
    # takes a path or stdin and does arithmetic on it. Verified by reading the
    # file, not inferred from the description.
    #
    # The CRM is how a PERSON produces the export. It is not something the script
    # reaches, and the difference is not pedantic: `needs` gates the step against
    # `set_reach`, so a workspace that has declined CRM had this step suppressed
    # — even though pasting an export would have worked perfectly. A declared
    # need the code does not have costs exactly the users who have the data in a
    # spreadsheet instead of a system.
    #
    # Same shape as declaring an `emits` an app has no `emit` permission to
    # raise: a manifest asserting a capability the code behind it does not have.
    # There it silently never fires; here it silently never runs.
    # NO FALLBACK, AND THE ABSENCE IS THE POINT. The script exists because this
    # is the arithmetic a model must not improvise; prose telling one to do it
    # by hand would be the exact failure the file prevents. With no fallback the
    # step is reported UNMET on a harness that cannot execute, which is the
    # honest outcome — an ICP built on invented revenue figures is worse than an
    # ICP that says it could not be computed.

emits:
  - icp.updated
  - icp.blocked

context:
  # Workspace-scoped: every later app reads these, so nobody is asked twice.
  #
  # `company_name` IS FIRST BECAUSE IT WAS MISSING, and the app dead-ended on it.
  #
  # The instructions open with {{company_name}}. That is NOT an undeclared
  # placeholder — it is one of the eight built-in workspace values
  # (company_name, crm, icp, industry, product, regions, sender_name,
  # sender_voice), it is a real field on `domain.WorkspaceValues`, and
  # `UnknownPlaceholders` returns empty for this prose. It can never render
  # literally.
  #
  # What it did instead was refuse. Substitution is strict, so an unset built-in
  # stops composition with "Define your ICP needs this workspace to describe
  # itself before its prompt can be built: your company is not set." Loud rather
  # than silent, which is the better failure — but this app asked for four other
  # workspace values and not this one, so a first run dead-ended and pointed at
  # `set_workspace_profile`, somewhere else, before the app could say anything.
  #
  # For the app whose entire thesis is "nobody is asked twice", that made this
  # the one value nobody was asked ONCE. Declaring it here means the app fills
  # its own prerequisite in the conversation it already has open.
  - key: company_name
    scope: workspace
    ask: "What's your company called?"
    type: text
  - key: product
    scope: workspace
    ask: "In one sentence, what do you sell?"
    type: text
  - key: industry
    scope: workspace
    ask: "What industry are you selling into?"
    type: text
  - key: regions
    scope: workspace
    ask: "Which regions matter?"
    type: list
  - key: icp
    scope: workspace
    ask: "Do you already have an ICP written down? Paste it, or say no."
    type: text
  # App-scoped: only this app cares.
  - key: best_customers
    scope: app
    ask: "Name three customers you'd clone if you could."
    type: list
    # Declared now that something reads it. It was omitted while the field was
    # inert — writing down that it was inert is what let somebody else confirm
    # the gap rather than wonder whether they had misread the loader. The
    # composer renders a "try the CRM first" line before this key's ask, and
    # suppresses it entirely for a workspace whose set_reach says crm is
    # declined, so nobody is told to try a CRM they have already said they
    # do not have.
    infer_from: [crm]
  - key: deal_breakers
    scope: app
    ask: "Who should we never sell to, even if they ask?"
    type: list
  - key: refresh_cadence
    scope: app
    ask: "How often should I re-check the ICP against new won deals?"
    type: enum
    options: [monthly, quarterly, never]

instructions: |-
  You are defining who {{company_name}} sells to. Work from evidence — won deals,
  named customers, real conversations — never from a generic template.

  An ICP is not finished until it has a segment, a persona, a deal-breaker and at
  least one won-deal example. Until all four exist, do not write it: stage a
  question with stage_draft saying exactly which is missing.

  When it is complete, write it with set_context(key: "icp") in 200 words or
  fewer. If you cannot complete it, say what stopped you and stage a question
  rather than writing a partial ICP — a guess written to the workspace is read
  by every app that comes after it.
