# Why this app is three skills and none of them ours.
#
# It replaces a five-line house skill called `research` that did the job by
# asserting it. Three people have written down how they actually research an
# account, and they disagree productively: one builds the intelligence brief,
# one compresses it into something a person can read before a call, and one
# sweeps what has been said lately. Kept as one file, none of them could be
# credited, versioned, or lifted into another app.
#
# `built_on` derives to Yoni Tserruya, Nadav David, Amir Baldiga — in that
# order, because first-appearance order is the credit line.
name: Research the account
description: One brief — who they are, what they sell, what changed, and who runs it.
category: find-and-research
type: research
version: 1.0.0
license: MIT
handler: llm

maintained_by:
  name: freegtm
  url: https://github.com/freegtmapps

say:
  - "research acme.com"
  - "brief me on Acme before my 2pm"
  - "what should I know about Notion?"

# ORDER IS COMPOSITION ORDER. Gather, then sweep, then compress: the brief is
# written last because it is the only one of the three that has to decide what
# to leave out, and it cannot do that before the other two have run.
skills:
  - account-intelligence
  - recent-discourse-sweep
  - account-research-brief

# `emit` is here because `emits:` below declares `research.blocked`, and without
# it that declaration was a promise the app could not keep.
#
# `may` is enforced by projection alone (APP-BUNDLE §3, conformance rule 14): an
# app without `emit` never has `emit_signal` projected. So this manifest declared
# a signal it structurally could not raise — the app could be blocked, would know
# it was blocked, and had no way to say so. It would fail silently, which is the
# one failure this tree argues against everywhere else.
#
# The fix is the permission, not the deletion. A research app that cannot
# announce a refusal leaves nothing for a play to route to a person, and
# `research.blocked` is a NON-EVENT — nothing else records that the research did
# not happen, because not happening leaves no row. That is exactly the test
# write-outreach applies to keep `outreach.blocked` and drop `outreach.drafted`.
may:
  - read
  - write_lead
  - emit

# `web` is required rather than optional because every one of these three skills
# is a research method, and a research app with nothing to read is not a
# degraded app, it is a different one that should refuse.
#
# ENRICHMENT IS THE CAPABILITY, NOT THE VENDOR. account-intelligence's own body
# says "Requires a Lusha connection" — that is its author writing for his own
# stack, and a manifest may not name a brand (APP-BUNDLE §5: capabilities, never
# brands). Declared as `enrichment`, optional, so an assistant that cannot reach
# any enrichment source is told once by `set_reach` and stops being asked.
# `web` is declared at the top level because Requires.Tools is DERIVED from it
# rather than hand-written — hand entry plus a load-time check would be two
# sources that agree until somebody edits one.
tools: [web]

requires:
  optional:
    tools: [enrichment, linkedin, crm, github]

# Inert on the registry and live on the platform. Signals are the commercial
# product (ruled 2026-09-06), so nothing raises this where the bundle is merely
# browsed; it stays declared so one bundle describes one app on both products.
#
# "Inert on the registry" was the whole of the old note, and it hid the defect
# above: the app could not raise this on the PLATFORM either, because `may` had
# no `emit`. Inert in one place by design and inert in the other by accident read
# identically from here, which is why the note now says which is which.
emits:
  - research.blocked

context:
  - key: product
    scope: workspace
    ask: "In one sentence, what do you sell?"
    type: text
  - key: icp
    scope: workspace
    ask: "Who do you sell to? Paste your ICP, or say no."
    type: text

# WHERE THE BRIEF LANDS, AND IN WHAT SHAPE.
#
# `type: research` now requires `output` (contracts/app.schema.yaml, delta 2), and `target` is a
# destination rather than a permission (delta 3): the brief belongs on the record this run is
# about. The agent running this app needs `records.<lead>.brief` in scope.context.writes and
# `scope.records: write`, or the pairing is refused at load.
#
# `sources` and `gaps` are BOTH REQUIRED, which is the instructions' own rule made checkable:
# "say which sources you used and name what you could not find — a gap stated is worth more
# than a gap filled in". A brief with no sources is a brief that was invented, and until now
# nothing could tell the difference.
output:
  name: account_brief
  target: records.<lead>.brief
  strict: true
  schema:
    type: object
    additionalProperties: false
    required: [company, what_they_sell, what_changed, people, sources, gaps]
    properties:
      company: {type: string}
      what_they_sell: {type: string}
      what_changed:
        description: What moved recently and when. Empty when nothing did — which is itself worth reading before a call.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [what]
          properties:
            what: {type: string}
            when: {type: string}
            source: {type: string}
      people:
        description: Who runs it, and why each one matters to this conversation.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, role]
          properties:
            name: {type: string}
            role: {type: string}
            why_they_matter: {type: string}
      sources:
        description: What you actually read. At least one — a brief with no sources was invented.
        type: array
        minItems: 1
        items: {type: string}
      gaps:
        description: What you could not find. Empty only when nothing was missing.
        type: array
        items: {type: string}

instructions: |-
  Research one account and produce a brief a person can read before a call.

  What we sell: {{product}}
  Who we sell to: {{icp}}

  Research before writing. Say which sources you used and name what you could
  not find — a gap stated is worth more than a gap filled in. Write the brief to
  the lead with update_lead.
