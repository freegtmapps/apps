# Why this app is separate skills rather than one block of prose.
#
# What a person calls "write outreach" is separable pieces of thinking: how to
# route across outreach shapes, what makes a line specific to one person, and
# how to anchor a message on the thing that surfaced the lead. Kept as one file,
# improving any of them means editing the others' text — and none could be
# credited, versioned, or lifted into another app on its own.
#
# ALL OF THEM ARE BORROWED. Splitting is what lets their authors keep their
# names on them, and it is the whole argument of the registry: an app is other
# people's thinking, assembled and credited, not prose we wrote and signed.
name: Write outreach
description: Drafts a short first email from one specific thing you actually observed.
category: reach-out
type: outreach
version: 1.0.0
license: MIT
handler: llm

# Who assembled this app, as a claim rather than a derivation.
#
# `built_on` is derived from skill frontmatter and can be trusted because the
# files carry it. Nothing records who put a bundle together, so this is typed —
# the same category as `adapted` before publish verifies it. freegtm composed
# these skills into this app; none of the thinking in them is ours and
# `built_on` says whose.
maintained_by:
  name: freegtm
  url: https://github.com/freegtmapps

say:
  - "write outreach for this lead"
  - "draft a first email"

# ORDER IS COMPOSITION ORDER, and it is the reason this list is hand-written
# rather than globbed. The hook is chosen before the email is written, and a
# bundle that composed them the other way round would produce a model that has
# been told how to write before it has been told what to say.
skills:
  # Order is composition order and it decides the credit line, because built_on
  # is first-appearance order. Broad borrowed thinking first, narrowing after:
  # reach-out routes across every outreach shape, personalization-6-buckets says
  # what makes a line specific, and signal-anchored-message narrows both to the
  # one case this app is for — a lead that surfaced from something observed.
  #
  # NONE OF THIS THINKING IS OURS, which is the point rather than an accident.
  # `find-the-hook` and `first-email` were freegtm's and did the jobs two named
  # authors already do; keeping them would have been us competing with the
  # contributors we are asking for. built_on now reads three community names and
  # maintained_by reads freegtm — assembled by us, thought by them.
  #
  # `b2b-cold-email-copywriting` (Tim Yakubson) belongs in this list and is not
  # in it yet. Its body carries {{company}}, {{first_name}}, {{trigger}} and
  # {{process}}, which are per-lead variables and not workspace values, so
  # composition refuses outright. Worse, it carries {{industry}} — which IS one
  # of ours and means the SELLER's industry, where upstream means the lead's. It
  # substitutes silently and reads perfectly: "Reference their devtools pain."
  # An upstream PR asking for those to be parameterised is the way in; adapting
  # his text to fit our substitution would make the credit line say `adapted`
  # about a rewrite that was ours.
  - reach-out
  - personalization-6-buckets
  - signal-anchored-message

# What this app needs said before it can run.
#
# DECLARED BECAUSE IT ALREADY REQUIRES THEM, not to change how they are asked.
# The prose substitutes {{product}}, {{sender_name}} and {{sender_voice}}, and a
# workspace value named by a placeholder and left unset REFUSES — so these three
# are the difference between an app that runs and one that cannot. Without this
# block `set_context` answered "Write outreach declares: nothing — it asks for no
# context" about an app that will not compose until three things are said. Two
# descriptions of one app's needs, and the one a person reads was the wrong one.
#
# THIS DOES NOT CHANGE THE ASKING. The registry setup path already asks, keyed on
# the placeholders rather than on this block: a fresh workspace gets "Write
# outreach cannot run yet: this workspace has not said what you sell", the exact
# set_context call, and "Still needed after this: the sender, the sender's
# voice." That path is why the app was never stuck, and it is unchanged.
#
# `icp` is deliberately NOT here. The app reads it — every workspace value it
# does not substitute arrives in the composed Context section — but it does not
# require it, and declaring what an app merely benefits from would make this list
# stop meaning "what must be said before this runs".
context:
  - key: product
    scope: workspace
    ask: "In one sentence, what do you sell?"
    type: text
  - key: sender_name
    scope: workspace
    ask: "Who are these emails from?"
    type: text
  - key: sender_voice
    scope: workspace
    ask: "How does that person write? A sentence describing their style."
    type: text

may:
  - read
  - stage
  - emit

requires:
  optional:
    tools: [crm]

# The app's own framing stays here: what it emits is a fact about how this
# workspace's plays are wired, not part of anybody's transferable thinking.
#
# Write outreach declared nothing, on the reasoning that staging is a platform
# action and needs no emission. A live run showed the gap: it drafted something
# it did not trust, wanted to say so, and reported "this step can't emit
# signals, so the verification request lives in the lead notes rather than
# routing onward." A draft that must not be sent yet is a different outcome from
# one that is ready, and only a signal can carry that difference.
emits:
  # `outreach.drafted` was here and is deliberately gone.
  #
  # stage_draft already emits `draft.staged` FROM INSIDE THE TOOL, carrying the
  # approval_id, and one call makes both — so it cannot announce a draft that
  # does not exist. A play in seed.go triggers on it. `outreach.drafted` was
  # model-emitted, had no consumer anywhere, and lied during a live run: an
  # `outreach.drafted` with a failed stage_draft behind it. A signal a model
  # raises alongside a tool that raises its own is a second, weaker account of
  # the same event, and the weaker one is the one that can be wrong.
  #
  # `outreach.blocked` stays, and the difference is the whole rule: it announces
  # a NON-EVENT. Nothing else knows the draft was withheld, because withholding
  # leaves no row. That is when a declared emit earns its place — when it is the
  # only way the thing can be known.
  - outreach.blocked

instructions: |-
  Draft a short first email from {{sender_name}}.

  What we sell: {{product}}
  How {{sender_name}} writes: {{sender_voice}}

  Stage it with stage_draft. A human reads every draft before anything is sent.
