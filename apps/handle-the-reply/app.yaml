# Three people who disagree about what a reply IS, which is the whole app.
#
# Nadav David's gate decides whether a reply is a pull worth acting on. Lucas
# Godtfredsen's says the thing everybody's first version gets wrong: an
# out-of-office and a bounce are not replies, and counting them is how a team
# ends up reporting a reply rate it does not have. Tanyo Gochev's decides what
# to send next given where the deal already is.
#
# Order is composition order, so `built_on` reads Nadav David, Lucas
# Godtfredsen, Tanyo Gochev. Classify before answering: a follow-up written
# before the reply has been understood is a follow-up to something else.
name: Handle the reply
description: Classify what came back, draft the right answer, or stop the sequence.
category: handle-replies
type: reply
version: 1.0.0
license: MIT
handler: llm

maintained_by:
  name: freegtm
  url: https://github.com/freegtmapps

say:
  - "Sam replied, what do I say?"
  - "classify these replies"

skills:
  - reply-pull-gate
  - auto-reply-is-not-a-reply
  - stage-aware-follow-up

may:
  - read
  - write_lead
  - stage
  - emit

# NO `rules:` YET, AND THE ABSENCE IS STILL DELIBERATE — BUT NOT FOR THE REASON
# THIS COMMENT USED TO GIVE.
#
# APP-CATALOG gives this app `confidence-gate.yaml` — below 0.8, ask a human
# rather than answer. It is the right gate.
#
# ⚠ THE OLD REASON WAS WRONG, and it was wrong in the expensive direction. It
# said: "measured on 2026-09-07: no code reads a rules/ directory and nothing
# calls RegisterRule, so Engine.Rules is empty in every deployment... the gate
# does not exist." That measurement was half a measurement. `rules:` was the
# mechanism DEFINED TWICE AND BUILT ONCE (APP-BUNDLE §1), and the sentence
# measured the dead half and concluded about the live one:
#
#   DEAD — `Engine.RegisterRule` (engine.go:58), the Go-registered evaluator.
#   Still called from tests only. `Engine.Rules` really is empty everywhere.
#
#   LIVE — `app.Bundle.Rules`, the file the bundle carries. `evalPreRules`
#   (engine.go:229) looks up `app.Bundle.Rules[rName]` FIRST and hands it to
#   `evalBundleRule` (bundlerules.go), with the registered evaluator consulted
#   only second. engine.go says so in place: "THE BUNDLE FIRST, because that is
#   where a rule now lives." `score-against-your-icp` ships `rules/icp-gate.yaml`
#   and it executes.
#
# So a bundle rule declared here WOULD run today. A comment asserting a
# capability does not exist, when it does, is the same failure as the gate it was
# protecting against — and the same shape as gtmsrv's `seed.go:95`, which told a
# reader to build a seam that already existed.
#
# THREE THINGS STILL MISSING, and they are a specification rather than a shrug:
#
#   1. AN `output` BLOCK WITH A `confidence` FIELD. This app declares
#      `type: reply`, which is not one of {research, scoring, analysis}, so
#      nothing forces `output` and nothing structured comes out of the run.
#      "Below 0.8" has no field to read. Note the scale when it is added:
#      confidence is a real in 0..1 everywhere on this platform
#      (contracts/context-table.md declares the column `real -- 0..1`), and a
#      threshold written `> 0.8` against integers passes for every value from 1
#      upward, silently.
#
#   2. A SECOND RULE KIND. `requires_context` is the only one that exists —
#      `RuleSpec.Validate` (domain/rule_spec.go) refuses any other at LOAD, and
#      `evalBundleRule`'s default arm fails closed naming the kind it could not
#      run. "Has this been said" cannot express "is this number above a floor".
#
#   3. A PLACE TO RUN IT, which is the structural one and is easy to miss.
#      Rules today are PRE-rules: `evalPreRules` runs "on an app before its
#      handler is called". This gate reads the model's own classification
#      confidence, so it cannot run before the model has produced one. Even with
#      1 and 2 built, a pre-rule would evaluate a field that does not exist yet.
#      `RuleEvaluator`'s own doc comment says "pre/post rule" and there is no
#      `evalPostRules` anywhere in the tree — the second half is named and not
#      built, which is how this whole field got its reputation.
#
# Declaring the gate before those three would ship a manifest saying a human is
# consulted below 0.8 while nothing consults anybody — a failure a person only
# discovers from the outcome.
#
# Until then the gate is prose: the instructions below ask for the uncertainty
# to be staged as a question, which a model can decline to do and a rule cannot.

requires:
  optional:
    tools: [email.read, calendar]

# `may` gains `emit`, so this declaration becomes one the app can keep.
# `may` is enforced by projection alone (APP-BUNDLE §3, conformance rule 14):
# without `emit`, `emit_signal` is never projected and this named a signal the
# app structurally could not raise.
#
# THIS IS THE ONE OF THE TWENTY-FOUR WITH A LIVE CONSEQUENCE RATHER THAN A
# LATENT ONE, and it is why the sweep starts here.
#
# `reply.unsubscribe` could not fire. contracts/send-constraints.md §3 makes
# suppression OUR store rather than the provider's, and the provider's
# `LEAD_UNSUBSCRIBED` webhook only covers someone who CLICKS the link. A person
# who types "take me off this list" in the body of a reply is exactly the case it
# does not cover — and this app is the only thing that reads that reply. So the
# app classified the opt-out correctly and then nothing happened.
#
# That becomes a compliance problem the day sending starts, which is about two
# weeks after a sending domain is named. The other three kinds route work; this
# one stops it.
emits:
  - reply.interested
  - reply.not_now
  - reply.wrong_person
  - reply.unsubscribe

context:
  - key: sender_voice
    scope: workspace
    ask: "How does the person who sent this write? Paste a couple of their emails, or describe it."
    type: text

instructions: |-
  Something came back. Decide what it is before deciding what to say.

  An auto-reply, an out-of-office and a bounce are NOT replies. Say so and stop
  — do not draft, and do not count them as interest.

  If it is a real reply, say what kind, then draft the answer in
  {{sender_voice}} and stage it with stage_draft. If you are not confident what
  kind of reply it is, stage a question instead (kind `answer`) rather than
  guessing: a wrong answer to a real prospect costs more than a delay.

  If they asked not to be contacted, call suppress. Immediately, before
  anything else.
