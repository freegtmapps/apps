# Company deep dive — composed from 3 skill(s) somebody else wrote.
#
# ORDER IS COMPOSITION ORDER, and it decides the credit line: `built_on` is
# derived from skill frontmatter in first-appearance order and can never be
# typed. Nothing about the credit on this page is a claim we made.
name: Company deep dive
description: "A sourced 360 on a company \u2014 market, funding, stack, leadership \u2014 plus a standing watch on what it says and ships."
category: find-and-research
version: 1.0.0
license: MIT
handler: llm

maintained_by:
  name: freegtm
  url: https://github.com/freegtmapps

say:
  - "do a full workup on Ramp"
  - "everything on Vercel"

skills:
  - company-deep-dive
  - enrich-company

# A SKILL THE CATALOGUE LISTS IS DELIBERATELY ABSENT.
#
# `launch-monitor` ships references/report-format.md collides with company-deep-dive's. References are keyed FLAT
# inside a bundle — a body routes to `references/x.md` without naming its own
# skill — so two skills owning one filename is a load refusal rather than
# whichever-loaded-last. Renaming the file would break the routing inside a body
# that is not ours to edit.

may:
  - read
  - write_lead
  - emit

# Declared at the TOP LEVEL because Requires.Tools is derived from it rather
# than hand-written — hand entry plus a load-time check would be two sources
# that agree until somebody edits one.
tools: [web]

# Hand-written because it is not derivable: it says what this app degrades
# gracefully without, which is a maintainer's judgement. Say no once through
# set_reach and it stops asking.
requires:
  optional:
    tools: [enrichment, github]

# Declarations that are INERT ON THE REGISTRY and live on the platform.
# Signals are the commercial product; nothing here raises these, and they stay
# so one bundle describes one app on both.
emits:
  - research.done

# WORKSPACE SCOPE IS A CLOSED SET — company_name, crm, icp, industry, product,
# regions, sender_name, sender_voice. A manifest inventing a ninth is refused,
# because a workspace-scoped key nothing reads from the profile would be asked
# for and then silently dropped after the person answered. Everything else is
# app-scoped, which is the honest state rather than a workaround.
context:
  - key: product
    scope: workspace
    ask: "In one sentence, what do you sell?"
    type: text
  - key: icp
    scope: workspace
    ask: "Who do you sell to? Paste your ICP, or say no."
    type: text

# NO {{placeholders}}. A workspace value named by a placeholder and left unset
# REFUSES composition, so a placeholder is a promise that the app cannot run
# until somebody has spoken. These apps do not need that: every declared
# workspace value reaches the prompt through the Context section for every app,
# whether or not its prose names the key.
instructions: |-
  A sourced 360 on a company — market, funding, stack, leadership — plus a standing watch on what it says and ships.

  Work from what you can actually reach and what is on the lead. Name what you could not find rather than filling it in — a gap stated is worth more than a gap invented, because the invented one gets repeated out loud.

  Write what you learn to the lead with update_lead.
